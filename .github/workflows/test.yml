name: PDF redaction tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
      - run: npm ci
      - run: python3 -m pip install --target .test-deps -r tests/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - run: npm run test:desktop:unit
      - run: npm run desktop:dist
      - name: Enable Electron's sandbox helper on the isolated runner
        run: sudo chown root:root release/linux-unpacked/chrome-sandbox && sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - run: xvfb-run -a npm run test:desktop
        env:
          CAVIARD_EXECUTABLE: ${{ github.workspace }}/release/linux-unpacked/caviard
      - run: npm run test:update-feed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-test-results
          path: |
            output/test-report/
            test-results/
            output/pdf/example-pdfs.zip
          retention-days: 14
