name: Store package preparation
on:
  pull_request:
    paths:
      - 'build/**'
      - 'electron/**'
      - 'src/**'
      - 'scripts/*store*'
      - 'electron-builder.config.cjs'
      - 'package*.json'
      - '.github/workflows/store-packages.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: Internal package only; does not submit or publish
        required: true
        type: choice
        options: [microsoft-store, microsoft-store-test, mac-app-store]
permissions:
  contents: read
jobs:
  windows-qa:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:desktop:unit
      - run: npm run build
      - run: node scripts/store-assets.mjs
      - name: Build and inspect non-submittable QA package
        env:
          INKLURA_DISTRIBUTION_CHANNEL: microsoft-store
          INKLURA_WINDOWS_IDENTITY_NAME: InkluraPDF.QA
          INKLURA_WINDOWS_PUBLISHER: CN=00000000-0000-0000-0000-000000000000
          INKLURA_WINDOWS_PUBLISHER_DISPLAY_NAME: Inklura PDF QA - NOT FOR SUBMISSION
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --config electron-builder.config.cjs --win appx --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-store-appx.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-store-QA-NOT-FOR-SUBMISSION
          path: release-microsoft-store/verification.json
          if-no-files-found: error
  windows-store:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'microsoft-store'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    env:
      INKLURA_DISTRIBUTION_CHANNEL: microsoft-store
      INKLURA_WINDOWS_IDENTITY_NAME: ${{ vars.INKLURA_WINDOWS_IDENTITY_NAME }}
      INKLURA_WINDOWS_PUBLISHER: ${{ vars.INKLURA_WINDOWS_PUBLISHER }}
      INKLURA_WINDOWS_PUBLISHER_DISPLAY_NAME: ${{ vars.INKLURA_WINDOWS_PUBLISHER_DISPLAY_NAME }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node -e "require('./electron-builder.config.cjs')"
      - run: npm ci
      - run: npm run build
      - run: node scripts/store-assets.mjs
      - run: npx electron-builder --config electron-builder.config.cjs --win appx --x64 --publish never
      - run: python scripts/verify-store-appx.py
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-internal-review
          path: |
            release-microsoft-store/*.appx
            release-microsoft-store/verification.json
          if-no-files-found: error
  windows-test-kit:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'microsoft-store-test'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Test the exact bytes already validated in Partner Center, not a rebuild.
      - uses: actions/download-artifact@v4
        with:
          name: microsoft-store-internal-review
          run-id: 41039014119
          github-token: ${{ github.token }}
          path: source-store-package
      - name: Prepare an ephemeral test signature and public certificate
        shell: pwsh
        run: ./scripts/sign-store-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Inklura-PDF-Windows-TEST-ONLY
          path: release-windows-test/*
          if-no-files-found: error
          retention-days: 14
  mac-store:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'mac-app-store'
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    env:
      INKLURA_DISTRIBUTION_CHANNEL: mac-app-store
      INKLURA_APPLE_TEAM_ID: ${{ vars.INKLURA_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare the BEO PLUS provisioning profile
        env:
          MAS_PROFILE_BASE64: ${{ secrets.MAS_PROFILE_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          if (!process.env.MAS_PROFILE_BASE64) throw new Error('Missing MAS_PROFILE_BASE64');
          const file = path.join(process.env.RUNNER_TEMP, 'inklura-pdf.provisionprofile');
          writeFileSync(file, Buffer.from(process.env.MAS_PROFILE_BASE64, 'base64'), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `INKLURA_MAS_PROVISIONING_PROFILE=${file}\n`);
          NODE
      - run: node -e "require('./electron-builder.config.cjs')"
      - run: npm ci
      - run: npm run build
      - name: Build signed MAS packages (not Developer ID DMGs)
        env:
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_KEY_PASSWORD }}
        run: |
          node -e "for (const key of ['CSC_LINK','CSC_INSTALLER_LINK']) if (!process.env[key]) throw new Error('Missing '+key)"
          npx electron-builder --config electron-builder.config.cjs --mac mas --x64 --arm64 --publish never
      - name: Verify app signatures and sandbox
        run: python3 scripts/verify-store-mas.py
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app-store-internal-review
          path: |
            release-mac-app-store/mas*/*.pkg
            release-mac-app-store/verification.json
          if-no-files-found: error
