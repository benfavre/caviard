name: Desktop releases
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python3 -m pip install -r tests/requirements.txt
      - run: python3 scripts/generate-examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-test-pdfs
          path: |
            output/pdf/examples/invoice-01.pdf
            output/pdf/examples/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: example-pdfs
          path: output/pdf/example-pdfs.zip
  build:
    needs: examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            flags: --linux --x64
            executable: release/linux-unpacked/caviard
          - os: windows-latest
            platform: windows
            flags: --win --x64
            executable: release/win-unpacked/Inklura PDF.exe
          - os: macos-latest
            platform: macos
            flags: --mac --x64 --arm64
            executable: release/mac-arm64/Inklura PDF.app/Contents/MacOS/Inklura PDF
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:desktop:unit
      - uses: actions/download-artifact@v4
        with:
          name: smoke-test-pdfs
          path: output/pdf/examples
      - name: Build installers and update manifests
        run: npm run desktop:dist -- ${{ matrix.flags }}
        env:
          INKLURA_PDF_ACCOUNT_API: https://outils.inklura.fr/api/inklura-pdf
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          INKLURA_REQUIRE_SIGNING: ${{ vars.INKLURA_REQUIRE_SIGNING }}
      - name: Verify configured signatures and notarization
        run: node scripts/verify-signatures.mjs
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      - name: Enable Electron's sandbox helper on the isolated Linux runner
        if: runner.os == 'Linux'
        run: sudo chown root:root release/linux-unpacked/chrome-sandbox && sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Verify installed Windows PDF and folder shell integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/Inklura-PDF-*-win-x64.exe | Select-Object -First 1
          ./scripts/verify-windows-integration.ps1 -Installer $installer.FullName
      - name: Verify macOS PDF registration
        if: runner.os == 'macOS'
        run: python3 scripts/verify-macos-integration.py
      - name: Verify packaged desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test --config playwright.desktop.config.mjs
        env:
          CAVIARD_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - name: Verify packaged desktop on Windows and macOS
        if: runner.os != 'Linux'
        run: npx playwright test --config playwright.desktop.config.mjs
        env:
          CAVIARD_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - name: Bundle additional synthetic AI examples
        if: runner.os == 'Linux'
        run: |
          node scripts/generate-ai-examples.mjs
          cd output/pdf/ai-examples
          zip -r ../../../release/inklura-ai-example-pdfs.zip .
      - run: npm run test:update-feed
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            release/beta*.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure version matches release tag
        run: node -e "if ('v'+require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: example-pdfs
          path: artifacts
      - name: Publish complete release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft --verify-tag --title "Inklura PDF $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
