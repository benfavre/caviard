# Inklura PDF dedicated product site; owned by caviard/hosting/pdf.
server {
    listen 80;
    listen [::]:80;
    server_name pdf.inklura.fr;
    location / { return 301 https://pdf.inklura.fr$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pdf.inklura.fr;
    root /home/infra-sj278/bext/sites/pdf-inklura-prism;
    ssl_certificate /etc/letsencrypt/bext-managed/pdf.inklura.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/bext-managed/pdf.inklura.fr/privkey.pem;
    location / { }
}
